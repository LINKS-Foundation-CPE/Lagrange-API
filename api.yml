        '403': { $ref: '#/components/responses/Forbidden' }

  /api/slots/series:
    post:
      tags: [Slots]
      summary: Create a recurring series of slots (admin)
      description: >
        Expands the recurrence and checks every occurrence against the rules a
        single slot must meet. With `dry_run` nothing is written. Otherwise all
        occurrences are created in one transaction under a shared `series_id`,
        or — if any conflict and `skip_conflicts` is not set — none are.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id, recurrence]
              properties:
                organization_id: { type: integer }
                recurrence: { $ref: '#/components/schemas/Recurrence' }
                dry_run: { type: boolean, default: false }
                skip_conflicts: { type: boolean, default: false }
      responses:
        '200': { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/SeriesResult' } } } }
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SeriesResult' } } } }
        '409': { description: Refused; nothing written, content: { application/json: { schema: { $ref: '#/components/schemas/SeriesResult' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/slots/series/{seriesId}:
    delete:
      tags: [Slots]
      summary: Delete every future slot of a series (admin)
      description: >
        Past slots are kept. Refused, deleting nothing, if any of the future
        slots holds a reservation — the rule single deletes apply.
      parameters:
        - { name: seriesId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  series_id: { type: string, format: uuid }
                  deleted: { type: integer }
                  kept_past: { type: integer }
        '400': { description: A future slot of the series holds reservations }
        '404': { description: No future slots in this series }

