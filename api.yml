  /api/reservations:
    get:
      tags: [Reservations]
      summary: List reservations
      parameters:
        - { $ref: '#/components/parameters/range' }
        - { $ref: '#/components/parameters/sort' }
        - { $ref: '#/components/parameters/filter' }
      responses:
        '200':
          description: Reservations
          headers:
            Content-Range: { $ref: '#/components/headers/Content-Range' }
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Reservation' } }
    post:
      tags: [Reservations]
      summary: Create a reservation (project admins; debits the project budget up-front)
      description: |
        The requested window is debited from the project budget immediately.
        With `SLOT_CONSTRAINED_RESERVATIONS=true` (default) the reservation
        must fall inside a slot belonging to the project's organization (or
        its reference organization) and `slot_id` is required; with the flag
        off, `slot_id` may be omitted and the window is only checked for
        overlaps, project validity and budget.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/reservations/series:
    post:
      tags: [Reservations]
      summary: Create a recurring series of reservations
      description: >
        Each occurrence is placed in the slot of the project's organization (or
        its reference organization) that covers it — resolved here, not chosen
        by the caller — and checked against every rule a single reservation
        must meet. The creatable occurrences' total cost must fit the project's
        budget; it is debited once and recorded as one budget event per
        reservation. `dry_run` and `skip_conflicts` as for slot series.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, recurrence]
              properties:
                project_id: { type: integer }
                description: { type: string }
                recurrence: { $ref: '#/components/schemas/Recurrence' }
                dry_run: { type: boolean, default: false }
                skip_conflicts: { type: boolean, default: false }
      responses:
        '200': { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/SeriesResult' } } } }
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SeriesResult' } } } }
        '409': { description: Refused; nothing written, content: { application/json: { schema: { $ref: '#/components/schemas/SeriesResult' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/reservations/series/{seriesId}:
    delete:
      tags: [Reservations]
      summary: Delete every future reservation of a series
      description: >
        Past reservations are kept. Each deleted one is refunded by the rule
        single deletes use — in full more than 24 hours ahead, a quarter closer
        than that — with one budget event each, in one transaction.
      parameters:
        - { name: seriesId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  series_id: { type: string, format: uuid }
                  deleted: { type: integer }
                  refunded_ms: { type: integer }
                  kept_past: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No future reservations in this series }

  /api/reservations/{id}:
    get:
      tags: [Reservations]
      summary: Get a reservation
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: Reservation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
    put:
      tags: [Reservations]
      summary: Not supported — delete and recreate
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '405': { description: Method not allowed }
    delete:
      tags: [Reservations]
      summary: Delete a future reservation (refunds 100% if >24h ahead, else 25%)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: Deleted (budget refunded) }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

