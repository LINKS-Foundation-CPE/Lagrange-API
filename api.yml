    get:
      tags: [Budget events]
      summary: List budget events (admin)
      parameters:
        - { $ref: '#/components/parameters/range' }
        - { $ref: '#/components/parameters/sort' }
        - { $ref: '#/components/parameters/filter' }
      responses:
        '200':
          description: Budget events
          headers:
            Content-Range: { $ref: '#/components/headers/Content-Range' }
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BudgetEvent' } }

  /api/budgetEvents/{id}:
    get:
      tags: [Budget events]
      summary: Get a budget event (admin)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: Budget event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetEvent' }

  /api/reports/reservations:
    get:
      tags: [Reports]
      summary: Reserved time in a period, by project or organization
      description: >-
        Reservation blocks lying entirely within the period. Attribution runs
        through the project, because a reservation carries no organization of
        its own. Open to platform admins and to organization managers and
        auditors, who see only their own organization.
      parameters:
        - { $ref: '#/components/parameters/reportFrom' }
        - { $ref: '#/components/parameters/reportTo' }
        - { $ref: '#/components/parameters/reportGroupBy' }
      responses:
        '200':
          description: Reservation report
          headers:
            Content-Range: { $ref: '#/components/headers/Content-Range' }
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReportRow' } }

  /api/reports/jobs:
    get:
      tags: [Reports]
      summary: Queue job execution in a period, by project or organization
      description: >-
        Jobs whose execution lies entirely within the period. Jobs that ran
        inside a reservation are excluded — that time is billed as reserved
        hours, and counting both would bill it twice.
      parameters:
        - { $ref: '#/components/parameters/reportFrom' }
        - { $ref: '#/components/parameters/reportTo' }
        - { $ref: '#/components/parameters/reportGroupBy' }
      responses:
        '200':
          description: Job report
          headers:
            Content-Range: { $ref: '#/components/headers/Content-Range' }
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReportRow' } }

  /api/reports/slots:
    get:
      tags: [Reports]
      summary: Allocated slot time in a period, by organization
      description: >-
        Slots belong to an organization directly, so this report has no project
        dimension and ignores `group_by`.
      parameters:
        - { $ref: '#/components/parameters/reportFrom' }
        - { $ref: '#/components/parameters/reportTo' }
      responses:
        '200':
          description: Slot report
          headers:
            Content-Range: { $ref: '#/components/headers/Content-Range' }
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReportRow' } }

  /api/reports/utilization:
    get:
      tags: [Reports]
      summary: How much of the reserved time was used
      description: >-
        The jobs that ran inside a reservation, matched to their block by
        project and containment, against the hours that block reserved.
        `count` and `total_seconds`/`total_hours` describe those jobs, so they
        mean the same as in the other reports.
      parameters:
        - { $ref: '#/components/parameters/reportFrom' }
        - { $ref: '#/components/parameters/reportTo' }
        - { $ref: '#/components/parameters/reportGroupBy' }
      responses:
        '200':
          description: Utilization report
          headers:
            Content-Range: { $ref: '#/components/headers/Content-Range' }
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/UtilizationReportRow' } }

  /api/reports/summary:
    get:
      tags: [Reports]
      summary: Every report for one period
      description: >-
        One round trip instead of four, so the sections of a report cannot
        drift onto different periods.
      parameters:
        - { $ref: '#/components/parameters/reportFrom' }
        - { $ref: '#/components/parameters/reportTo' }
      responses:
        '200':
          description: All reports for the period
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSummary' }

